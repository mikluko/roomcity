# The server's listener on the pod's network: the ConnectRPC services of the
# sessions and the homeserver's application service. The transcripts page is
# on a loopback listener of its own and is not here.
apiVersion: v1
kind: Service
metadata:
  name: roomcity
spec:
  selector:
    app.kubernetes.io/name: roomcity
  ports:
    - name: server
      port: 8080
      targetPort: server
