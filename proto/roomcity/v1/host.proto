syntax = "proto3";

package roomcity.v1;

import "google/protobuf/timestamp.proto";

// HostService is what a session host calls on the server. The host dials
// the server and never the reverse, so a host that outlives a restart of the
// server attaches again on its own.
service HostService {
  // Attach opens the stream of instructions for one session. A host that
  // attaches again names the last instruction it carried out and receives
  // the ones after it.
  rpc Attach(AttachRequest) returns (stream AttachResponse);
  // Report hands the server the ACP messages exchanged with the agent, in
  // order. The server acknowledges the last one it stored; the host sends
  // the ones after it again when a call fails.
  rpc Report(ReportRequest) returns (ReportResponse);
  // Stage hands the host what gc's start of the session names on the server's
  // side: a manifest, then the files, as a tar stream. The host asks once,
  // before it starts the agent.
  rpc Stage(StageRequest) returns (stream StageResponse);
  // Handled tells the server what the host did with a prompt it was handed,
  // so that the room can show a prompt that waits for the running turn's end.
  rpc Handled(HandledRequest) returns (HandledResponse);
  // Send hands the server a file of the session's working directory to put
  // in the session's room, and answers with the room's event for it.
  rpc Send(SendRequest) returns (SendResponse);
}

message AttachRequest {
  // The session's name, as gc gave it to the runtime at start.
  string session = 1;
  // The seq of the last instruction the host carried out, 0 for none.
  uint64 last_seq = 2;
}

message AttachResponse {
  // The instruction's place in the session's order, from 1.
  uint64 seq = 1;
  oneof instruction {
    Prompt prompt = 2;
    Cancel cancel = 3;
    PermissionAnswer permission_answer = 4;
    Stop stop = 5;
  }
}

// Prompt is text for the agent: its next turn when it is idle.
message Prompt {
  string text = 1;
  PromptSource source = 2;
  // into_turn asks the host to put the text into the running turn, where one
  // runs and the agent takes a message into it, and else to treat it as the
  // next turn's prompt. The server sets it for the owner's prompts and never
  // for gc's, which wait for the turn's end.
  bool into_turn = 3;
}

enum PromptSource {
  PROMPT_SOURCE_UNSPECIFIED = 0;
  // The owner wrote it in the session's room.
  PROMPT_SOURCE_OWNER = 1;
  // gc sent it as a nudge.
  PROMPT_SOURCE_GC = 2;
}

// Cancel ends the running turn, as ACP's session/cancel does. The owner's
// !stop also drops the owner's prompts that wait; gc's interrupt does not.
message Cancel {
  // keep_waiting says to drop nothing: every prompt that waits stays queued
  // and runs once the turn has stopped, the owner's first.
  bool keep_waiting = 1;
}

// PermissionAnswer answers one session/request_permission of the agent.
message PermissionAnswer {
  // The id of the agent's JSON-RPC request, as JSON.
  string request_id = 1;
  // The id of the option chosen among those the request offered. Empty
  // means the request is cancelled.
  string option_id = 2;
}

message HandledRequest {
  string session = 1;
  // The seq of the prompt instruction.
  uint64 instruction_seq = 2;
  Handling handling = 3;
}

message HandledResponse {}

message SendRequest {
  string session = 1;
  // The file's name, without a directory.
  string name = 2;
  // The file's media type, as the host knows it from the name and the content.
  string media_type = 3;
  // What the owner reads with it; may be empty.
  string caption = 4;
  bytes data = 5;
}

message SendResponse {
  // The room's event that carries the file.
  string event = 1;
}

// Handling is what became of a prompt in the host.
enum Handling {
  HANDLING_UNSPECIFIED = 0;
  // The agent took the text into the turn that was running.
  HANDLING_STEERED = 1;
  // The text began a turn of its own.
  HANDLING_STARTED = 2;
  // A turn is running that the text cannot join, so it waits for the turn's
  // end; HANDLING_STARTED follows when its turn begins.
  HANDLING_QUEUED = 3;
}

// Stop ends the agent and the host with it.
message Stop {}

message ReportRequest {
  string session = 1;
  repeated Frame frames = 2;
}

message ReportResponse {
  // The seq of the last frame the server has stored for the session.
  uint64 last_seq = 1;
}

// Frame is one JSON-RPC message of the ACP stream between the host and the
// agent, as it was on the wire.
message Frame {
  // The frame's place in the session's stream, from 1.
  uint64 seq = 1;
  google.protobuf.Timestamp time = 2;
  FrameDirection direction = 3;
  bytes message = 4;
}

enum FrameDirection {
  FRAME_DIRECTION_UNSPECIFIED = 0;
  FRAME_DIRECTION_TO_AGENT = 1;
  FRAME_DIRECTION_FROM_AGENT = 2;
}

message StageRequest {
  string session = 1;
}

message StageResponse {
  oneof part {
    // Manifest is the first message of the stream, and the only one.
    StageManifest manifest = 1;
    // Archive is a piece of the tar stream that follows the manifest, to be
    // joined in order. The files in it are extracted under the session's
    // working directory, which is where the paths in it are relative to.
    bytes archive = 2;
  }
}

// StageManifest is what the host does around the agent's start.
message StageManifest {
  // The agent's command as gc's start gave it, program name first, split
  // into words. A path in it is absolute in the pod. What the host does with
  // it is the agent's business: the host of Claude Code takes the words after
  // the program as claude's arguments, and ignores the program.
  repeated string command = 1;
  // Commands run with sh -c in the working directory, before the agent
  // starts. One that fails ends the host.
  repeated string pre_start = 2;
  // Commands run the same way once the agent's session is up, then the
  // script, then the live commands. One that fails is logged, not fatal.
  repeated string session_setup = 3;
  // The text of a script, run with sh after session_setup.
  string session_setup_script = 4;
  repeated string session_live = 5;
}
