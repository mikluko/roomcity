version: v2
clean: true
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: sarak.sh/mikluko/roomcity/internal/gen
plugins:
  - local: ["go", "tool", "protoc-gen-go"]
    out: internal/gen
    opt: paths=source_relative
  - local: ["go", "tool", "protoc-gen-connect-go"]
    out: internal/gen
    opt: paths=source_relative
